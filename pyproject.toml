[project]
name = "html-parser"
version = "0.1.0"
description = "HTML parser for protocol run extraction"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "configparser>=7.2.0",
    "demjson3>=3.0.6",
    "lxml>=5.0.0",
    "numpy>=2.2.6",
    "selenium>=4.41.0",
    "webdriver-manager>=4.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
