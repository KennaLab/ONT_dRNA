[settings]
keys_of_interest = [
        "run_setup",
        "run_settings",
        "software_versions",
        "header",
        "alignment_enabled",
        "barcoding_enabled",
        "basecalling_enabled",
        "duplex_enabled",
        "run_start_time",
        "run_end_time",
        "run_status",
        "run_complete",
        "estimated_n50",
        "flow_cell_id",
        "data_output",
        "basecalling",
        "run_report_generation_template_version"
    ]
